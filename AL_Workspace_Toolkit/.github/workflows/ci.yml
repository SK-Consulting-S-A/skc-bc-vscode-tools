name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Public release safety check
        env:
          PUBLIC_DENY_PATTERNS: ${{ secrets.PUBLIC_DENY_PATTERNS }}
        run: npm run check:public

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npm run package -- --out "$RUNNER_TEMP/skc-al-workspace.vsix"

      - name: Audit runtime dependencies
        run: npm audit --omit=dev
