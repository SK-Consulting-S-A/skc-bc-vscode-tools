name: Publish AL Workspace Toolkit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VSCE_PAT: ${{ secrets.VSCE_PAT }}

jobs:
  publish:
    name: Publish separate Marketplace extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AL_Workspace_Toolkit
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: AL_Workspace_Toolkit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish
        run: npm run publish
