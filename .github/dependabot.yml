version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Luxembourg
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    rebase-strategy: auto
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    labels:
      - dependencies
      - javascript
    groups:
      root-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      root-routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      root-major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /SKC_VSCode_Extension
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Luxembourg
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    rebase-strategy: auto
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    labels:
      - dependencies
      - javascript
    groups:
      extension-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      extension-routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      extension-major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    rebase-strategy: auto
    labels:
      - dependencies
    groups:
      github-actions-updates:
        patterns:
          - "*"